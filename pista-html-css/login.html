<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PistaProject</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="card login-card">
        <div class="card-header">
          <h3 class="card-title">Fazer login na PISTA</h3>
          <p class="card-description">Preencha os campos para fazer login na PISTA.</p>
        </div>

        <div class="card-content">
          <form class="login-form">
            <div class="field-sm">
              <label class="label" for="email">Email</label>
              <input class="input" type="email" id="email" placeholder="m@example.com" />
            </div>

            <div class="field-sm">
              <div class="password-row">
                <label class="label" for="password">Password</label>
                <a href="#" class="link">Esqueceu sua senha?</a>
              </div>
              <input class="input" type="password" id="password" />
            </div>
          </form>
        </div>

        <div class="card-footer">
          <a class="btn btn-full" href="shop.html">Entrar agora</a>
        </div>
      </div>
    </div>
  </body>
</html>
