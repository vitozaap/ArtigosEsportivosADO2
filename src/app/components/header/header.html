<div class="w-full py-4 px-32 border flex gap-3 items-center justify-between">
  <div class="flex items-center gap-12">
    <h1 [class]="logoClass">{{ logoName }}</h1>
    <div class="flex gap-2">
      @if (isAdmin) {
        @for (item of adminHeaderItems; track item) {
          <button hlmBtn variant="ghost" class="cursor-pointer" [routerLink]="item.path">
            {{ item.label }}
          </button>
        }
      }
      @if (!isAdmin) {
        @for (item of userHeaderItems; track item) {
          <button hlmBtn variant="ghost" class="cursor-pointer" [routerLink]="item.path">
            {{ item.label }}
          </button>
        }
      }
    </div>
  </div>
  <div class="flex items-center gap-1">
    <button
      hlmBtn
      size="icon-sm"
      variant="ghost"
      class="cursor-pointer"
      [attr.aria-label]="
        themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'
      "
      (click)="themeService.toggle()"
    >
      @if (themeService.theme() === 'dark') {
        <ng-icon hlm size="sm" name="lucideSun" />
      } @else {
        <ng-icon hlm size="sm" name="lucideMoon" />
      }
    </button>
    <div class="flex gap-2 items-center border rounded-full px-2 py-1">
      <hlm-avatar size="sm">
        <span hlmAvatarFallback>
          {{ logoIcon }}
        </span>
      </hlm-avatar>
      <p class="text-sm font-semibold">{{ name }}</p>
    </div>
    <button
      hlmBtn
      size="icon-sm"
      variant="ghost"
      class="cursor-pointer"
      routerLink="/login"
      (click)="userService.deleteUser()"
    >
      <ng-icon hlm size="sm" name="lucideLogOut" />
    </button>
  </div>
</div>
