<section class="w-full max-w-sm" hlmCard>
  <div hlmCardHeader>
    <h3 hlmCardTitle>Login to your account</h3>
    <p hlmCardDescription>Enter your email below to login to your account</p>

    <div hlmCardAction>
      <button hlmBtn variant="link">Sign Up</button>
    </div>
  </div>

  <div hlmCardContent>
    <form [formGroup]="form" id="login" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-6">
        <div class="grid gap-2">
          <label hlmLabel for="email">Email</label>
          <input type="email" id="email" placeholder="m@example.com" formControlName="email" required hlmInput />
        </div>

        <div class="grid gap-2">
          <div class="flex items-center">
            <label hlmLabel for="password">Password</label>
            <a href="#" class="ml-auto inline-block text-sm underline-offset-4 hover:underline">
              Forgot your password?
            </a>
          </div>
          <input type="password" id="password" hlmInput formControlName="password" />
        </div>
      </div>
    </form>
  </div>

  <div hlmCardFooter class="flex-col gap-2">
    <button hlmBtn type="submit" form="login" class="w-full">Login</button>
  </div>
</section>
